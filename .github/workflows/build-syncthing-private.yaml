name: Build Syncthing Private Mode

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g., v1.0.0-private)'
        required: false
        default: ''
  # 推送到 private 分支时触发
  push:
    branches: [ private ]
    tags:
      - 'v*-private'

env:
  # Go 版本设置
  GO_VERSION: "~1.22.0"

  # 优化兼容性设置
  GO386: softfloat
  GOARM: "5"
  GOMIPS: softfloat

  # 构建元数据
  BUILD_USER: fatenocaster
  BUILD_HOST: github.actions

jobs:
  # 构建主程序 syncthing
  build-syncthing:
    name: Build syncthing-${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux 64位
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          # Windows 64位
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
          # macOS M 系列（ARM64）
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true

      - name: Build syncthing
        run: |
          # 构建 syncthing
          go run build.go -goos ${{ matrix.goos }} -goarch ${{ matrix.goarch }} build syncthing

          # 重命名二进制文件
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv syncthing.exe syncthing-${{ matrix.suffix }}.exe
            BINARY_NAME="syncthing-${{ matrix.suffix }}.exe"
          else
            mv syncthing syncthing-${{ matrix.suffix }}
            BINARY_NAME="syncthing-${{ matrix.suffix }}"
          fi

          # 输出文件信息
          ls -lh $BINARY_NAME
          file $BINARY_NAME || true
          echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_ENV

      - name: Upload syncthing artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncthing-${{ matrix.suffix }}
          path: syncthing-${{ matrix.suffix }}*
          retention-days: 30

  # 构建发现服务器 stdiscosrv
  build-discovery:
    name: Build stdiscosrv-${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux 64位
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          # Windows 64位
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
          # macOS M 系列（ARM64）
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true

      - name: Build stdiscosrv
        run: |
          # 构建 stdiscosrv
          go run build.go -goos ${{ matrix.goos }} -goarch ${{ matrix.goarch }} build stdiscosrv

          # 重命名二进制文件
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv stdiscosrv.exe stdiscosrv-${{ matrix.suffix }}.exe
            BINARY_NAME="stdiscosrv-${{ matrix.suffix }}.exe"
          else
            mv stdiscosrv stdiscosrv-${{ matrix.suffix }}
            BINARY_NAME="stdiscosrv-${{ matrix.suffix }}"
          fi

          # 输出文件信息
          ls -lh $BINARY_NAME
          file $BINARY_NAME || true

      - name: Upload stdiscosrv artifact
        uses: actions/upload-artifact@v4
        with:
          name: stdiscosrv-${{ matrix.suffix }}
          path: stdiscosrv-${{ matrix.suffix }}*
          retention-days: 30

  # 构建中继服务器 strelaysrv
  build-relay:
    name: Build strelaysrv-${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux 64位
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          # Windows 64位
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
          # macOS M 系列（ARM64）
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true

      - name: Build strelaysrv
        run: |
          # 构建 strelaysrv
          go run build.go -goos ${{ matrix.goos }} -goarch ${{ matrix.goarch }} build strelaysrv

          # 重命名二进制文件
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv strelaysrv.exe strelaysrv-${{ matrix.suffix }}.exe
            BINARY_NAME="strelaysrv-${{ matrix.suffix }}.exe"
          else
            mv strelaysrv strelaysrv-${{ matrix.suffix }}
            BINARY_NAME="strelaysrv-${{ matrix.suffix }}"
          fi

          # 输出文件信息
          ls -lh $BINARY_NAME
          file $BINARY_NAME || true

      - name: Upload strelaysrv artifact
        uses: actions/upload-artifact@v4
        with:
          name: strelaysrv-${{ matrix.suffix }}
          path: strelaysrv-${{ matrix.suffix }}*
          retention-days: 30

  # 创建 Release
  create-release:
    name: Create Release
    needs: [build-syncthing, build-discovery, build-relay]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          check-latest: true

      - name: Get version info
        id: version
        run: |
          # 获取当前代码的版本信息
          VERSION=$(go run build.go version)
          echo "Current version: $VERSION"

          # 如果手动指定了 release tag，使用指定的
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # 如果是 tag 触发，使用 tag 名称
            RELEASE_TAG="${{ github.ref_name }}"
          else
            # 使用当前版本加上时间戳
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            RELEASE_TAG="$VERSION-private-$TIMESTAMP"
          fi

          echo "Release tag: $RELEASE_TAG"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files

          # 移动所有构建文件到 release-files 目录
          find artifacts -type f \( -name "syncthing-*" -o -name "stdiscosrv-*" -o -name "strelaysrv-*" \) -exec cp {} release-files/ \;

          # 创建校验和文件
          cd release-files
          sha256sum * > sha256sum.txt

          echo "=== Release Files ==="
          ls -lh
          echo "==================="

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: Syncthing Private Mode ${{ steps.version.outputs.release_tag }}
          body: |
            ## Syncthing 私有模式 ${{ steps.version.outputs.release_tag }}

            这是 Syncthing 的私有模式版本，默认不加入公共 P2P 网络。

            ### 主要特性
            ✅ 默认禁用自动升级
            ✅ 默认禁用全局发现服务器
            ✅ 默认禁用本地发现广播
            ✅ 默认禁用中继服务器
            ✅ 完全网络隔离，保护隐私

            ### 版本信息
            - **基础版本**: ${{ steps.version.outputs.version }}
            - **构建时间**: ${{ github.run_id }}
            - **提交哈希**: ${{ github.sha }}

            ### 包含的程序

            #### 1. syncthing - 主同步程序
            - `syncthing-linux-amd64` - Linux 64位
            - `syncthing-windows-amd64.exe` - Windows 64位
            - `syncthing-macos-arm64` - macOS M系列芯片

            #### 2. stdiscosrv - 私有发现服务器
            - `stdiscosrv-linux-amd64` - Linux 64位
            - `stdiscosrv-windows-amd64.exe` - Windows 64位
            - `stdiscosrv-macos-arm64` - macOS M系列芯片

            #### 3. strelaysrv - 私有中继服务器
            - `strelaysrv-linux-amd64` - Linux 64位
            - `strelaysrv-windows-amd64.exe` - Windows 64位
            - `strelaysrv-macos-arm64` - macOS M系列芯片

            ### 使用说明

            详细使用说明请查看仓库中的 `PRIVATE_MODE_USAGE.md` 文件。

            **基本使用：**
            ```bash
            # 1. 运行主程序（默认私有模式）
            ./syncthing

            # 2. 搭建私有发现服务器（可选）
            ./stdiscosrv -listen :8443 -db-dir ./discovery.db

            # 3. 搭建私有中继服务器（可选）
            ./strelaysrv -listen :22067
            ```

            **启用 P2P 网络（可选）：**
            ```bash
            ./syncthing serve --no-p2p=false
            ```

            ### 下载说明
            1. 下载对应您系统的二进制文件
            2. Linux/macOS 用户添加执行权限：`chmod +x <文件名>`
            3. 验证文件完整性：参考 `sha256sum.txt`

            ### 支持的平台
            - **Linux**: amd64 (x86_64)
            - **Windows**: amd64 (x86_64)
            - **macOS**: arm64 (Apple Silicon M1/M2/M3/M4)

            ### 注意事项
            ⚠️ 默认模式下设备需要手动配置连接地址
            ⚠️ 不会自动发现局域网内的其他设备
            ⚠️ 不会通过公共中继服务器转发数据
            ✅ 可搭建私有发现和中继服务器实现内网穿透

            ---

            **基于提交**: ${{ github.sha }}
          draft: false
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
